<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NichoRadar AI</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#0f1a2e;--mut:#5b6b85;--bd:#dde3ee;--ac:#0e7c86;--ok:#13824b;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e8eef9;--mut:#93a3bf;--bd:#24324d;--ac:#35c4d0;--ok:#3ddc84;--bad:#ff6b5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:8px 0 2px}h1 span{color:var(--ac)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin-top:10px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:10px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;width:100%;margin-top:14px}
button:disabled{opacity:.6}
.tabs{display:flex;gap:8px;margin-bottom:4px}
.tabs button{flex:1}.tabs button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.msg{font-size:13px;margin-top:10px;min-height:18px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd);font-size:14px}
.res b{font-size:20px}.pos{color:var(--ok)}.neg{color:var(--bad)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.it small{color:var(--mut);display:block}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Nicho<span>Radar</span> AI</h1>
<p class="sub">Encontre oportunidades para vender na internet.</p>

<div id="auth" class="card hide">
 <div class="tabs"><button id="tIn" class="on">Entrar</button><button id="tUp">Criar conta</button></div>
 <label>E-mail<input id="em" type="email" autocomplete="email"></label>
 <label>Senha (mínimo 6 caracteres)<input id="pw" type="password" autocomplete="current-password"></label>
 <button class="p" id="go">Entrar</button>
 <div class="msg" id="am"></div>
</div>

<div id="app" class="hide">
 <div class="card top"><span id="who"></span><button id="out">Sair</button></div>
 <div class="card">
  <b>Calculadora rápida</b>
  <label>Nome do cálculo<input id="nm" placeholder="Ex.: Garrafa térmica, fornecedor A"></label>
  <div class="row">
   <label>Compra (R$)<input id="c1" type="number" inputmode="decimal" min="0" step="0.01"></label>
   <label>Frete (R$)<input id="c2" type="number" inputmode="decimal" min="0" step="0.01"></label>
   <label>Preço de venda (R$)<input id="c3" type="number" inputmode="decimal" min="0" step="0.01"></label>
   <label>Taxa da plataforma (%)<input id="c4" type="number" inputmode="decimal" min="0" step="0.01"></label>
   <label>Impostos (%)<input id="c5" type="number" inputmode="decimal" min="0" step="0.01"></label>
   <label>Anúncios (R$)<input id="c6" type="number" inputmode="decimal" min="0" step="0.01"></label>
  </div>
  <div class="res" id="res">Preencha o preço de venda para ver o resultado.</div>
  <button class="p" id="save">Salvar na minha conta</button>
  <div class="msg" id="sm"></div>
 </div>
 <div class="card"><b>Meus cálculos salvos</b><div id="list"><div class="sub">Carregando…</div></div></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL="https://qokemmxpjbuzclipnrgh.supabase.co";
var SUPABASE_KEY="sb_publishable_HaGbGtrr0Diygok-7M36nw_DcwNKeKI"; // chave pública (segura no app)
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var $=function(i){return document.getElementById(i)};
var mode="in";

function erro(e){
 var m=(e&&e.message)||"";
 if(/Invalid login/i.test(m))return "E-mail ou senha incorretos.";
 if(/not confirmed/i.test(m))return "Confirme seu e-mail primeiro (veja sua caixa de entrada).";
 if(/already registered/i.test(m))return "Este e-mail já tem conta. Use a aba Entrar.";
 if(/at least 6/i.test(m))return "A senha precisa ter pelo menos 6 caracteres.";
 if(/rate limit/i.test(m))return "Muitas tentativas. Aguarde um pouco.";
 return "Algo deu errado: "+m;
}
function amsg(t,c){var e=$("am");e.textContent=t;e.className="msg "+(c||"")}
function setMode(m){mode=m;$("tIn").classList.toggle("on",m==="in");$("tUp").classList.toggle("on",m==="up");$("go").textContent=m==="in"?"Entrar":"Criar conta";$("pw").autocomplete=m==="in"?"current-password":"new-password";amsg("")}
$("tIn").onclick=function(){setMode("in")};
$("tUp").onclick=function(){setMode("up")};

$("go").onclick=async function(){
 var em=$("em").value.trim(),pw=$("pw").value;
 if(!em||!pw){amsg("Preencha e-mail e senha.","err");return}
 $("go").disabled=true;amsg("Aguarde…");
 try{
  if(mode==="in"){
   var r=await sb.auth.signInWithPassword({email:em,password:pw});
   if(r.error)throw r.error;
  }else{
   var r2=await sb.auth.signUp({email:em,password:pw});
   if(r2.error)throw r2.error;
   if(!r2.data.session)amsg("Conta criada! Enviamos um e-mail de confirmação. Confirme e volte para entrar.","ok");
  }
 }catch(e){amsg(erro(e),"err")}
 $("go").disabled=false;
};
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
$("out").onclick=function(){sb.auth.signOut()};

function n(id){var x=parseFloat($(id).value);return isNaN(x)||x<0?0:x}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function calc(){
 var v=n("c3");
 if(v<=0){$("res").textContent="Preencha o preço de venda para ver o resultado.";return null}
 var custo=n("c1")+n("c2")+v*n("c4")/100+v*n("c5")/100+n("c6"),l=v-custo,m=l/v*100;
 $("res").innerHTML='Custo total: '+brl(custo)+'<br>Lucro líquido estimado: <b class="'+(l>=0?"pos":"neg")+'">'+brl(l)+'</b><br>Margem estimada: <b class="'+(l>=0?"pos":"neg")+'">'+m.toFixed(1).replace(".",",")+'%</b>';
 return {custo:custo,lucro:l,margem:m};
}
["c1","c2","c3","c4","c5","c6"].forEach(function(i){$(i).addEventListener("input",calc)});

$("save").onclick=async function(){
 var r=calc(),sm=$("sm");
 if(!r){sm.textContent="Preencha o preço de venda antes de salvar.";sm.className="msg err";return}
 var nome=$("nm").value.trim()||"Cálculo sem nome";
 var cen=[{nome:nome,compra:n("c1"),frete:n("c2"),venda:n("c3"),taxa_pct:n("c4"),imp_pct:n("c5"),ads:n("c6"),custo:r.custo,lucro:r.lucro,margem_pct:r.margem,tipo_dados:"digitado pelo usuario"}];
 $("save").disabled=true;sm.textContent="Salvando…";sm.className="msg";
 var res=await sb.from("calculos").insert({nome:nome,cenarios:cen});
 if(res.error){sm.textContent=erro(res.error);sm.className="msg err"}
 else{sm.textContent="Salvo!";sm.className="msg ok";load()}
 $("save").disabled=false;
};

async function load(){
 var box=$("list"),res=await sb.from("calculos").select("id,nome,cenarios,criado_em").order("criado_em",{ascending:false}).limit(50);
 box.innerHTML="";
 if(res.error){box.textContent=erro(res.error);return}
 if(!res.data.length){var d=document.createElement("div");d.className="sub";d.textContent="Nenhum cálculo salvo ainda.";box.appendChild(d);return}
 res.data.forEach(function(c){
  var s=(c.cenarios&&c.cenarios[0])||{},row=document.createElement("div"),l=document.createElement("div"),nm=document.createElement("div"),sm=document.createElement("small"),b=document.createElement("button");
  row.className="it";nm.textContent=c.nome;
  sm.textContent=(typeof s.lucro==="number"?"Lucro "+brl(s.lucro)+" · margem "+s.margem_pct.toFixed(1).replace(".",",")+"%":"")+" · "+new Date(c.criado_em).toLocaleDateString("pt-BR");
  l.appendChild(nm);l.appendChild(sm);b.textContent="Apagar";
  b.onclick=async function(){if(!confirm("Apagar este cálculo?"))return;var r=await sb.from("calculos").delete().eq("id",c.id);if(r.error)alert(erro(r.error));else load()};
  row.appendChild(l);row.appendChild(b);box.appendChild(row);
 });
}

function show(session){
 $("auth").classList.toggle("hide",!!session);
 $("app").classList.toggle("hide",!session);
 if(session){$("who").textContent=session.user.email;load()}
}
sb.auth.onAuthStateChange(function(_e,session){show(session)});
sb.auth.getSession().then(function(r){show(r.data.session)});
</script>
</body>
</html>
